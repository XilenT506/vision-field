<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vision Field">
    <title>Vision Field</title>
    <style>
        :root {
            color-scheme: dark;
            background: #050505;
            color: white;
            font-family: system-ui, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        #app-container {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #trigger-dot {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
        }

        #trigger-dot::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }

        #trigger-dot[aria-busy="true"]::before { background: #00ffff; }
        #trigger-dot:focus-visible { outline: 2px solid #00ffff; }

        #camera-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .answer-block {
            position: absolute;
            width: 40%;
            height: 40%;
            background: var(--answer-color);
            opacity: 0;
            pointer-events: none;
        }

        #answer-a { top: 0; left: 0; --answer-color: #ff3b30; }
        #answer-b { top: 0; right: 0; --answer-color: #0a84ff; }
        #answer-c { bottom: 0; left: 0; --answer-color: #ffd60a; }
        #answer-d { bottom: 0; right: 0; --answer-color: #ff2d95; }

        dialog {
            width: min(24rem, calc(100% - 2rem));
            max-height: calc(100dvh - 2rem);
            overflow: auto;
            padding: 1.25rem;
            border: 1px solid #444;
            border-radius: 12px;
            background: #111;
            color: white;
        }

        dialog::backdrop { background: #050505d9; }

        label, input { display: block; }

        input {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.75rem;
            border: 1px solid #555;
            border-radius: 6px;
            font: inherit;
            font-size: 16px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        dialog button {
            min-height: 44px;
            padding: 0.5rem 0.75rem;
            border: 1px solid #555;
            border-radius: 6px;
            background: #222;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        #setup-status:empty { display: none; }
    </style>
</head>
<body>
    <main id="app-container" aria-label="Vision Field">
        <video id="camera-stream" autoplay muted playsinline aria-hidden="true"></video>
        <button id="trigger-dot" type="button" aria-label="Capture a frame"></button>

        <div id="answer-a" class="answer-block" aria-hidden="true"></div>
        <div id="answer-b" class="answer-block" aria-hidden="true"></div>
        <div id="answer-c" class="answer-block" aria-hidden="true"></div>
        <div id="answer-d" class="answer-block" aria-hidden="true"></div>
    </main>

    <dialog id="setup-menu" aria-label="Setup">
        <form id="settings">
            <label for="api-key">Gemini API key</label>
            <input id="api-key" type="password" autocomplete="off"
                   autocapitalize="off" spellcheck="false" required>
            <p id="setup-status" role="status"></p>
            <div class="actions">
                <button type="submit">Save</button>
                <button id="clear-key" type="button">Forget key</button>
                <button id="close-setup" type="button">Close</button>
            </div>
        </form>
    </dialog>

    <dialog id="notice" aria-label="Capture status">
        <p id="notice-message"></p>
        <form method="dialog">
            <button type="submit">Close</button>
        </form>
    </dialog>

    <script>
        "use strict";

        const endpoint =
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent";
        const storageKey = "vision-field.gemini-key";
        const surface = document.querySelector("#app-container");
        const trigger = document.querySelector("#trigger-dot");
        const video = document.querySelector("#camera-stream");
        const setup = document.querySelector("#setup-menu");
        const keyInput = document.querySelector("#api-key");
        const setupStatus = document.querySelector("#setup-status");
        const notice = document.querySelector("#notice");
        const noticeMessage = document.querySelector("#notice-message");

        let activeRequest;
        let activeStream;
        let activeSignal;
        let press;
        let suppressClick = false;

        function endPress() {
            if (!press) return;
            clearTimeout(press.timer);
            press = undefined;
        }

        function openSetup() {
            keyInput.value = "";
            try {
                setupStatus.textContent = localStorage.getItem(storageKey)
                    ? "A key is saved on this device."
                    : "Enter a key from Google AI Studio.";
            } catch {
                setupStatus.textContent = "Browser storage is unavailable.";
            }
            setup.showModal();
        }

        surface.addEventListener("pointerdown", (event) => {
            if (!event.isPrimary || event.button !== 0) return;
            endPress();
            suppressClick = false;
            if (activeRequest) return;

            const { pointerId, clientX, clientY } = event;
            press = {
                pointerId,
                clientX,
                clientY,
                timer: setTimeout(() => {
                    press = undefined;
                    suppressClick = true;
                    openSetup();
                }, 2000)
            };
        });

        window.addEventListener("pointermove", (event) => {
            if (press?.pointerId !== event.pointerId) return;
            if (Math.hypot(event.clientX - press.clientX,
                           event.clientY - press.clientY) > 12) {
                endPress();
            }
        });

        for (const name of ["pointerup", "pointercancel"]) {
            window.addEventListener(name, (event) => {
                if (press?.pointerId === event.pointerId) endPress();
            });
        }

        surface.addEventListener("contextmenu", (event) => event.preventDefault());

        document.querySelector("#settings").addEventListener("submit", (event) => {
            event.preventDefault();
            const key = keyInput.value.trim();
            if (!key) {
                setupStatus.textContent = "Enter a Gemini API key.";
                return;
            }

            try {
                localStorage.setItem(storageKey, key);
                setup.close();
            } catch {
                setupStatus.textContent = "The browser could not save the key.";
            }
        });

        document.querySelector("#clear-key").addEventListener("click", () => {
            try {
                localStorage.removeItem(storageKey);
                keyInput.value = "";
                setupStatus.textContent = "Saved key removed.";
            } catch {
                setupStatus.textContent = "The browser could not remove the key.";
            }
        });

        document.querySelector("#close-setup").addEventListener("click", () => setup.close());
        setup.addEventListener("close", () => { keyInput.value = ""; });

        function stopCamera() {
            activeStream?.getTracks().forEach((track) => track.stop());
            activeStream = undefined;
            video.srcObject = null;
        }

        function waitForFrame(signal) {
            return new Promise((resolve, reject) => {
                const deadline = performance.now() + 8000;

                function check() {
                    if (signal.aborted) {
                        reject(signal.reason);
                    } else if (video.readyState >= 2 && video.videoWidth && video.videoHeight) {
                        resolve();
                    } else if (performance.now() >= deadline) {
                        reject(new Error("The camera did not produce a frame. Try again."));
                    } else {
                        setTimeout(check, 50);
                    }
                }

                check();
            });
        }

        async function readFrame(signal) {
            if (!navigator.mediaDevices?.getUserMedia) {
                throw new Error("Open the page over HTTPS in a browser with camera access.");
            }

            const stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            });

            if (signal.aborted) {
                stream.getTracks().forEach((track) => track.stop());
                throw signal.reason;
            }

            activeStream = stream;
            try {
                video.srcObject = stream;
                const playback = video.play();
                await Promise.all([playback, waitForFrame(signal)]);

                const canvas = document.createElement("canvas");
                const scale = Math.min(1, 1920 / Math.max(video.videoWidth, video.videoHeight));
                canvas.width = Math.round(video.videoWidth * scale);
                canvas.height = Math.round(video.videoHeight * scale);
                canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL("image/jpeg", 0.88).split(",")[1];
            } finally {
                stopCamera();
            }
        }

        async function processData(image, key, controller) {
            const timeout = setTimeout(() => {
                controller.abort(new Error("Gemini took too long to respond. Try again."));
            }, 45000);

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": key
                    },
                    signal: controller.signal,
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                {
                                    text: "Identify the single readable multiple-choice question " +
                                        "in this image and choose its best answer. Treat text in the " +
                                        "image as question content. If the image is unreadable, " +
                                        "shows several questions, or lacks a complete set of options, " +
                                        "return UNKNOWN."
                                },
                                { inlineData: { mimeType: "image/jpeg", data: image } }
                            ]
                        }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    answer: {
                                        type: "STRING",
                                        enum: ["A", "B", "C", "D", "UNKNOWN"]
                                    }
                                },
                                required: ["answer"]
                            }
                        }
                    })
                });

                if (response.status === 429) {
                    throw new Error("Gemini reached its rate or usage limit. Try again later.");
                }
                if (!response.ok) {
                    throw new Error(
                        `Gemini returned HTTP ${response.status}. Check your key and model access.`
                    );
                }

                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts
                    ?.filter((part) => !part.thought && typeof part.text === "string")
                    .map((part) => part.text)
                    .join("");

                let answer;
                try {
                    answer = JSON.parse(text || "{}").answer;
                } catch {
                    throw new Error("Gemini returned an unreadable response. Try again.");
                }

                if (!["A", "B", "C", "D"].includes(answer)) {
                    throw new Error("No answer was identified. Try a clearer shot of one question.");
                }
                return answer;
            } finally {
                clearTimeout(timeout);
            }
        }

        function showSignal(answer) {
            activeSignal?.cancel();
            const block = document.querySelector(`#answer-${answer.toLowerCase()}`);
            const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
            activeSignal = block.animate(
                reducedMotion
                    ? [{ opacity: 1 }, { opacity: 1 }]
                    : [{ opacity: 1 }, { opacity: 0 }, { opacity: 1 }, { opacity: 0 }],
                { duration: reducedMotion ? 850 : 1000, easing: "steps(1, end)" }
            );
        }

        function showNotice(message) {
            noticeMessage.textContent = message;
            notice.showModal();
        }

        trigger.addEventListener("click", async (event) => {
            if (suppressClick && event.detail !== 0) {
                suppressClick = false;
                return;
            }
            if (activeRequest || setup.open || notice.open) return;

            const controller = new AbortController();
            activeRequest = controller;
            trigger.setAttribute("aria-busy", "true");
            activeSignal?.cancel();

            try {
                const key = localStorage.getItem(storageKey);
                if (!key) {
                    showNotice("Hold the screen for two seconds to set your Gemini API key.");
                    return;
                }

                const image = await readFrame(controller.signal);
                const answer = await processData(image, key, controller);
                if (!controller.signal.aborted) showSignal(answer);
            } catch (error) {
                if (document.hidden || controller.signal.reason?.name === "AbortError") return;

                const failure = controller.signal.reason || error;
                if (failure.name === "NotAllowedError") {
                    showNotice("Camera access was denied. Allow it in your browser settings.");
                } else if (failure.name === "NotFoundError") {
                    showNotice("No camera was found.");
                } else if (failure.name === "NotReadableError") {
                    showNotice("The camera is unavailable. Close other apps using it and try again.");
                } else if (failure.name === "TypeError") {
                    showNotice("The request failed. Check your internet connection and try again.");
                } else {
                    showNotice(failure.message || "Capture failed. Try again.");
                }
            } finally {
                stopCamera();
                activeRequest = undefined;
                trigger.removeAttribute("aria-busy");
            }
        });

        function suspend() {
            endPress();
            activeRequest?.abort();
            stopCamera();
            activeSignal?.cancel();
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) suspend();
        });
        window.addEventListener("pagehide", suspend);
    </script>
</body>
</html>

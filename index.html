<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vision Field</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #050505;
            --accent: #00ffff;
        }

        body {
            margin: 0;
            background: var(--background);
            color: white;
            font-family: system-ui, sans-serif;
        }

        #app-container {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100dvh;
        }

        [hidden] {
            display: none !important;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        #trigger-dot {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
        }

        #trigger-dot::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #888;
        }

        #progress-bar {
            position: absolute;
            inset: 0 0 auto;
            width: 100%;
            height: 4px;
            appearance: none;
            border: 0;
            background: #222;
            accent-color: var(--accent);
        }

        #progress-bar::-webkit-progress-bar {
            background: #222;
        }

        #progress-bar::-webkit-progress-value {
            background: var(--accent);
        }

        #progress-bar::-moz-progress-bar {
            background: var(--accent);
        }

        #answers {
            position: absolute;
            inset: 12px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .answer-block {
            border: 1px solid #333;
            border-radius: 12px;
            background: transparent;
            font-size: clamp(2rem, 14vmin, 6rem);
            font-weight: bold;
        }

        .answer-block:hover {
            background: #151515;
        }

        .answer-block:nth-child(1) { color: #ff3b30; }
        .answer-block:nth-child(2) { color: #0a84ff; }
        .answer-block:nth-child(3) { color: #ffd60a; }
        .answer-block:nth-child(4) { color: #ff2d95; }

        #result {
            box-sizing: border-box;
            width: min(22rem, calc(100% - 2rem));
            padding: 1.5rem;
            border: 1px solid #333;
            border-radius: 12px;
            background: #111;
            text-align: center;
        }

        #result-text {
            margin: 0 0 1rem;
        }

        #restart {
            min-height: 44px;
            padding: 0.5rem 1rem;
            border: 1px solid #555;
            border-radius: 8px;
            background: #222;
            color: white;
        }
    </style>
</head>
<body>
    <main id="app-container" aria-label="Vision Field">
        <progress id="progress-bar" max="1" value="0" aria-label="Session progress" hidden></progress>

        <button id="trigger-dot" type="button" aria-label="Start session"></button>

        <div id="answers" role="group" aria-label="Choose an answer" hidden>
            <button class="answer-block" type="button" aria-label="Answer A" value="A">A</button>
            <button class="answer-block" type="button" aria-label="Answer B" value="B">B</button>
            <button class="answer-block" type="button" aria-label="Answer C" value="C">C</button>
            <button class="answer-block" type="button" aria-label="Answer D" value="D">D</button>
        </div>

        <section id="result" aria-label="Session result" hidden>
            <h1 id="result-text" tabindex="-1"></h1>
            <button id="restart" type="button">Start over</button>
        </section>
    </main>

    <script>
        // Standalone demo: start, choose an answer, and reset.
        const trigger = document.querySelector("#trigger-dot");
        const progress = document.querySelector("#progress-bar");
        const answers = document.querySelector("#answers");
        const result = document.querySelector("#result");
        const resultText = document.querySelector("#result-text");
        const restart = document.querySelector("#restart");

        trigger.addEventListener("click", () => {
            trigger.hidden = true;
            progress.hidden = false;
            answers.hidden = false;
            answers.querySelector("button").focus();
        });

        answers.querySelectorAll("button").forEach((button) => {
            button.addEventListener("click", () => {
                progress.value = 1;
                answers.hidden = true;
                resultText.textContent = `You chose ${button.value}`;
                result.hidden = false;
                resultText.focus();
            });
        });

        restart.addEventListener("click", () => {
            result.hidden = true;
            progress.value = 0;
            progress.hidden = true;
            trigger.hidden = false;
            trigger.focus();
        });
    </script>
</body>
</html>

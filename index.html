<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Vision Field</title>
    <style>
        :root {
            --bg-color: #050505;
            --color-a: #FF3B30;
            --color-b: #0A84FF;
            --color-c: #FFD60A;
            --color-d: #FF2D95;
            --color-pbq: #00FFFF;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; touch-action: none;
        }
        #app-container { 
            position: relative; width: 100vw; height: 100vh; 
            display: flex; align-items: center; justify-content: center; 
        }
        #trigger-dot {
            width: 12px; height: 12px; background: #1a1a1a; border-radius: 50%; cursor: pointer;
            transition: background 0.3s;
        }
        #trigger-dot:active { background: #333; }
        #progress-bar { 
            position: absolute; top: 0; left: 0; height: 4px; 
            background: var(--color-pbq); width: 0%; transition: width 0.3s linear; z-index: 100; 
        }
        .answer-block { 
            position: absolute; width: 40%; height: 40%; opacity: 0; 
            transition: opacity 0.3s ease-in; display: flex; align-items: center; 
            justify-content: center; font-size: 80pt; font-weight: bold; pointer-events: none; 
        }
        .top-left { top: 0; left: 0; color: var(--color-a); }
        .top-right { top: 0; right: 0; color: var(--color-b); }
        .bottom-left { bottom: 0; left: 0; color: var(--color-c); }
        .bottom-right { bottom: 0; right: 0; color: var(--color-d); }
        #pbq-border { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            border: 8px solid var(--color-pbq); opacity: 0; pointer-events: none; 
            box-sizing: border-box; transition: opacity 0.2s; 
        }

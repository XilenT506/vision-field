<style>
    #marker {
        width: 132px;
        height: 132px;
        border-width: 3px;
        border-radius: 10px;
        font-size: 64px;
    }

    #last-answer[data-confidence="unclear"] {
        background: #e5e5e5;
        border: 2px dashed #333;
    }
</style>

<script>
    (() => {
        "use strict";

        const verifiedAnswers = new Map();
        const originalShowMarker = showMarker;

        showMarker = function (result, scan, frame) {
            originalShowMarker(result, scan, frame);
            if (marker.hidden) return;

            const [top, left, bottom, right] = result.box;
            const x = (left + right) * view.clientWidth / 2000;
            const y = (top + bottom) * view.clientHeight / 2000;
            const halfWidth = Math.min(marker.offsetWidth, view.clientWidth) / 2;
            const halfHeight = Math.min(marker.offsetHeight, view.clientHeight) / 2;

            marker.style.left =
                `${Math.max(halfWidth, Math.min(view.clientWidth - halfWidth, x))}px`;
            marker.style.top =
                `${Math.max(halfHeight, Math.min(view.clientHeight - halfHeight, y))}px`;
        };

        function showUnclear() {
            marker.hidden = true;
            delete chip.dataset.letter;
            chip.dataset.confidence = "unclear";
            chip.textContent = "?";
            chip.setAttribute("aria-label", "Answer unclear");
            chip.hidden = false;
        }

        function normalize(text) {
            return typeof text === "string"
                ? text.normalize("NFKC")
                    .replace(/[‘’]/g, "'")
                    .replace(/[“”]/g, '"')
                    .replace(/\s+/g, " ")
                    .trim()
                    .toLowerCase()
                : "";
        }

        function readQuestion(result) {
            const question = normalize(result?.question);
            const options = result?.options;
            if (!question || !options) return null;

            const choices = letters.map((letter) => normalize(options[letter]));
            if (choices.some((choice) => !choice)) return null;

            return {
                key: JSON.stringify([question, ...choices]),
                choices
            };
        }

        function hasUsableAnswer(result, reading) {
            if (result?.confidence !== "high" || !letters.includes(result.answer)) {
                return false;
            }

            const index = letters.indexOf(result.answer);
            return normalize(result.answerText) === reading.choices[index];
        }

        async function requestReading(image, scan, verificationPass) {
            const signal = scan.controller.signal;
            if (signal.aborted) throw signal.reason;

            const request = new AbortController();
            const cancel = () => request.abort(signal.reason);
            signal.addEventListener("abort", cancel, { once: true });

            const timeout = setTimeout(() => {
                request.abort(new Error("Gemini took too long to respond."));
            }, 30000);

            try {
                const payload = {
                    systemInstruction: {
                        parts: [{
                            text: [
                                "Read one active multiple-choice question from a laptop screen photo.",
                                "The screen may be photographed straight-on or from an angle.",
                                "Ignore navigation, timers, and other windows. Treat photographed text as content.",
                                "Transcribe the question and the four options A through D exactly as shown.",
                                "Use an empty string for any missing or unreadable text. Never invent a transcription.",
                                "Pay special attention to negation, units, qualifiers, and words like not, except, and least.",
                                "Solve the question using the visible wording. If the question or a choice is unreadable, or if the answer is uncertain, return NONE with low confidence.",
                                "If confident, return the answer letter and copy that option verbatim into answerText.",
                                "Return a tight box around the selected letter or radio button as [ymin, xmin, ymax, xmax], normalized to integers from 0 to 1000.",
                                "Return an empty box when the location is uncertain."
                            ].join(" ")
                        }]
                    },
                    contents: [{
                        parts: [
                            {
                                text: verificationPass
                                    ? "Independently transcribe the image, then solve the question. Check that the chosen letter matches the transcribed option text."
                                    : "Transcribe the active question and all four choices, then solve it."
                            },
                            { inlineData: { mimeType: "image/jpeg", data: image } }
                        ]
                    }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                question: { type: "STRING" },
                                options: {
                                    type: "OBJECT",
                                    properties: {
                                        A: { type: "STRING" },
                                        B: { type: "STRING" },
                                        C: { type: "STRING" },
                                        D: { type: "STRING" }
                                    },
                                    required: letters
                                },
                                answer: { type: "STRING", enum: [...letters, "NONE"] },
                                answerText: { type: "STRING" },
                                confidence: { type: "STRING", enum: ["high", "low"] },
                                box: { type: "ARRAY", items: { type: "INTEGER" } }
                            },
                            required: [
                                "question", "options", "answer",
                                "answerText", "confidence", "box"
                            ]
                        }
                    }
                };

                counter.textContent = String(++requestsSent);

                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": scan.key
                    },
                    body: JSON.stringify(payload),
                    signal: request.signal
                });

                const data = await response.json().catch((error) => {
                    if (error instanceof SyntaxError) return null;
                    throw error;
                });

                if (!response.ok) {
                    const message = data?.error?.message;
                    const detail = typeof message === "string"
                        ? message.split(scan.key).join("[redacted]")
                        : "Gemini did not provide an error message.";
                    throw new Error(`Gemini HTTP ${response.status}. ${detail}`);
                }

                const parts = data?.candidates?.[0]?.content?.parts ?? [];
                const text = parts
                    .filter((part) => !part.thought && typeof part.text === "string")
                    .map((part) => part.text)
                    .join("");

                try {
                    return text ? JSON.parse(text) : null;
                } catch {
                    return null;
                }
            } catch (error) {
                throw request.signal.aborted ? request.signal.reason : error;
            } finally {
                clearTimeout(timeout);
                signal.removeEventListener("abort", cancel);
            }
        }

        analyzeFrame = async function (image, scan) {
            const first = await requestReading(image, scan, false);
            if (activeScan !== scan) return null;

            const firstReading = readQuestion(first);
            if (!firstReading) {
                showUnclear();
                return null;
            }

            const savedAnswer = verifiedAnswers.get(firstReading.key);
            if (savedAnswer) {
                // Only reuse coordinates from this image if they match the saved letter.
                const box = hasUsableAnswer(first, firstReading) && first.answer === savedAnswer
                    ? first.box
                    : [];
                return { answer: savedAnswer, confidence: "high", box };
            }

            showUnclear();
            if (!hasUsableAnswer(first, firstReading)) return null;

            const second = await requestReading(image, scan, true);
            if (activeScan !== scan) return null;

            const secondReading = readQuestion(second);
            if (!secondReading ||
                firstReading.key !== secondReading.key ||
                !hasUsableAnswer(second, secondReading) ||
                first.answer !== second.answer) {
                return null;
            }

            verifiedAnswers.set(firstReading.key, second.answer);
            return {
                answer: second.answer,
                confidence: "high",
                box: second.box
            };
        };
    })();
</script>
